name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zipapp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 生成单文件程序
        run: python scripts/打包.py
      - uses: actions/upload-artifact@v4
        with:
          name: knot-py
          path: dist/knot.pyz
      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="docs/发布说明/${GITHUB_REF_NAME}.md"
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            if [ -f "$NOTES" ]; then
              gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
                --notes-file "$NOTES" --verify-tag || true
            else
              gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
                --generate-notes --verify-tag || true
            fi
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/knot.pyz --clobber

  nuitka:
    # Nuitka 不支持交叉编译：各平台各自构建（开发文档 15.4）
    # Windows 未纳入矩阵：Nuitka 在 Windows 上会调用 depends.exe 探测 DLL 依赖，
    # 在无交互运行器上会挂死（曾连续两次跑满 6 小时被取消）；Windows 请用 knot.pyz 或 安装.ps1
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . nuitka
      - name: 构建可执行程序
        run: python scripts/构建可执行.py
      - uses: actions/upload-artifact@v4
        with:
          name: knot-${{ matrix.os }}
          path: dist/可执行/*
      - name: 上传到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="docs/发布说明/${GITHUB_REF_NAME}.md"
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            if [ -f "$NOTES" ]; then
              gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
                --notes-file "$NOTES" --verify-tag || true
            fi
          fi
          # 只上传文件：Nuitka 的 *.dist 中间目录不是附件
          gh release upload "${GITHUB_REF_NAME}" \
            $(find dist/可执行 -maxdepth 1 -type f) --clobber
