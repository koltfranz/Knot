name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8" "ruff>=0.6"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: 测试
        run: python -m pytest -q
      - name: 语法大全一致性
        run: python scripts/生成语法大全.py --检查

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: zipapp 冒烟
        run: |
          python -m zipapp src -m "knot.cli.main:main" -o knot.pyz
          python knot.pyz 初始化 /tmp/账本 --非交互 --年份 2026
          python knot.pyz --账本 /tmp/账本/main.knot 记 38 餐饮 -f 现金 -n 午饭
          python knot.pyz --账本 /tmp/账本/main.knot 检查 --静默
          python knot.pyz --账本 /tmp/账本/main.knot 报 收支
